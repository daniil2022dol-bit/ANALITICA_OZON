# Append to the existing proxy config after saving its previous contents.
# Before TLS issuance, install only this HTTP server (omit redirect temporarily).
server {
    listen 80;
    server_name 185.255.132.160;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://185.255.132.160$request_uri; }
}
server {
    listen 443 ssl;
    server_name 185.255.132.160;
    ssl_certificate /etc/letsencrypt/live/ozon-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ozon-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 32k;
    location / {
        proxy_pass http://host.docker.internal:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
